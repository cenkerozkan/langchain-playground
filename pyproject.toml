[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["langchain_p", "langgraph_p"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["langchain_p", "langgraph_p"]
